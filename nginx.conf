server {
    listen 80;
    server_name mesharialtawfiq.com www.mesharialtawfiq.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mesharialtawfiq.com www.mesharialtawfiq.com;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/mesharialtawfiq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mesharialtawfiq.com/privkey.pem;

    # React frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Node.js backend
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
